*{box-sizing:border-box}

#fullscreen{font-weight:800}
body.phone-fullscreen{
  overflow:hidden;
  background:#071a14;
  position:fixed;
  inset:0;

body.phone-fullscreen .minor button{

function damage(){if(inv||dead)return;Sound.fx('hit');if(--lives<=0){dead=true;run=false;Sound.fx('over');Sound.stop();cancelAnimationFrame(raf);obox.innerHTML='<h2>GAME OVER</h2><button class="btn" id="rr">RESTART ROUND</button>';ov.style.display='flex';setTimeout(()=>document.getElementById('rr').onclick=()=>{lives=3;dead=false;reset();run=true;Sound.play();loop()},0);return}P.x=L[round].o?40:25;P.y=rskyStart();camY=L[round].sky?Math.max(0,L[round].worldH-400):0;P.vy=0;inv=80}
function draw(){let r=L[round];if(r.sky){x.fillStyle='#8edcff';x.fillRect(0,0,700,400);x.save();x.translate(0,-camY);x.fillStyle='#fff';for(let cy=100;cy<r.worldH;cy+=170){let cx=(cy*3)%620+40;x.beginPath();x.ellipse(cx,cy,55,14,0,0,7);x.fill()}}else{bg()}if(!r.sky){x.fillStyle='#24384c';x.fillRect(0,0,700,28);}x.fillStyle='#fff';x.font='bold 13px Arial';x.fillText('HERO: SUPER '+hero.toUpperCase(),10,19);x.fillText(round===11?'BONUS ROUND 11':'ROUND '+round+'/13',round===11?270:300,19);x.fillText('BOTTLES '+count+'/'+r.g,480,19);x.fillText('LIVES '+'♥'.repeat(Math.max(lives,0)),610,19);
if(r.o){x.fillStyle='#17120e';x.fillRect(0,335,700,65);x.fillStyle='#5d431f';for(let i=0;i<700;i+=55){x.beginPath();x.ellipse(i+20,350+(i%3)*5,28,8,0,0,7);x.fill()}}
r.p.forEach(a=>{x.fillStyle='#20c975';x.fillRect(...a);x.fillStyle='#76501b';x.fillRect(a[0],a[1]+9,a[2],5)});
(r.s||[]).forEach(a=>{x.fillStyle='#183d2c';x.beginPath();x.ellipse(a[0]+a[2]/2,a[1]+7,a[2]/2,9,0,0,7);x.fill();x.fillStyle='#6b8e23';x.beginPath();x.ellipse(a[0]+a[2]/2,a[1]+5,a[2]/3,4,0,0,7);x.fill()});
bottles.filter(b=>!b.t).forEach(b=>{x.fillStyle='#0da8e8';x.fillRect(b.x+5,b.y,6,7);x.fillStyle='#fff';x.fillRect(b.x+2,b.y+7,12,16);x.fillStyle='#0a9d65';x.font='11px Arial';x.fillText('♻',b.x+3,b.y+20)});
x.fillStyle='#fff';x.fillRect(...r.e);x.strokeStyle='#08a05e';x.lineWidth=4;x.strokeRect(...r.e);x.fillStyle='#08a05e';x.font='28px Arial';x.fillText('♻',r.e[0]+9,r.e[1]+36);
if(r.m)monster();(r.pm||[]).forEach(a=>{x.fillStyle='#37474f';x.fillRect(a[0],a[1],42,38);x.fillStyle='#fff';x.fillRect(a[0]+7,a[1]+7,9,8);x.fillRect(a[0]+25,a[1]+7,9,8);x.fillStyle='#d32f2f';x.fillRect(a[0]+10,a[1]+10,4,4);x.fillRect(a[0]+27,a[1]+10,4,4);x.fillStyle='#050505';x.fillRect(a[0]+9,a[1]+25,25,7)});shots.forEach(s=>{x.fillStyle='#606b70';x.fillRect(s.x,s.y,s.w,s.h);x.fillStyle='#a3e635';x.fillRect(s.x+5,s.y+3,6,3)});oil.forEach(o=>{x.fillStyle='#21160e';x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill()});dogs.forEach(styroDog);if(inv%10<5)hd(x,hero,P.x,P.y,1);if(r.sky){x.restore();x.fillStyle='#24384c';x.fillRect(0,0,700,28);x.fillStyle='#fff';x.font='bold 13px Arial';x.textAlign='left';x.fillText('HERO: SUPER '+hero.toUpperCase(),10,19);x.fillText('BONUS STAGE '+round,270,19);x.fillText('BOTTLES '+count+'/'+r.g,480,19);x.fillText('LIVES '+'♥'.repeat(Math.max(lives,0)),610,19)}}
function update(){let r=L[round],old=P.y;if(dead)return;if(key.l)P.x-=4.15;if(key.r)P.x+=4.15;P.x=Math.max(0,Math.min(673,P.x));if(key.j&&!jl&&P.on){P.vy=-10.9;P.on=0;Sound.fx('jump')}jl=key.j;P.vy+=.59;P.y+=P.vy;P.on=0;
r.p.forEach(a=>{if(P.vy>=0&&P.x+P.w>a[0]&&P.x<a[0]+a[2]&&old+P.h<=a[1]+4&&P.y+P.h>=a[1]){P.y=a[1]-P.h;P.vy=0;P.on=1;if(old+P.h<a[1]-3)Sound.fx('land')}});if(r.sky){let target=Math.max(0,Math.min(r.worldH-400,P.y-230));camY+=(target-camY)*.12;}
if((r.o&&P.y+P.h>=335)||(!r.o&&!r.sky&&P.y>410)||(r.sky&&P.y>r.worldH+10))damage();(r.s||[]).forEach(a=>{if(hit({x:P.x+5,y:P.y+P.h-5,w:P.w-10,h:5},{x:a[0]+5,y:a[1],w:a[2]-10,h:a[3]}))damage()});
bottles.forEach(b=>{if(!b.t&&hit(P,b)){b.t=1;count++;Sound.fx('collect')}});let e={x:r.e[0],y:r.e[1],w:r.e[2],h:r.e[3]};if(count===r.g&&hit(P,e)){if(round===13){victory();return}else{Sound.fx('round');round++;reset()}}
frame++;if(r.pm&&frame%r.f===0){Sound.fx('shoot');r.pm.forEach(a=>{let dir=a[0]>350?-1:1;shots.push({x:a[0]+(dir<0?-8:40),y:a[1]+20,w:18,h:10,vx:dir*3.2,vy:0,g:0})})}if(r.m&&frame%r.f===0){Sound.fx('shoot');if(round===10){let ps=[[-5.3,0,0,325],[-4.6,-3.2,.08,319],[-4.2,-6.2,.22,319],[-5,2,.03,285]],p=ps[Math.floor(Math.random()*ps.length)];shots.push({x:584,y:p[3],w:18,h:10,vx:p[0],vy:p[1],g:p[2]})}else shots.push({x:584,y:323,w:18,h:10,vx:-r.sp,vy:0,g:0})}
shots.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=s.g;if(hit(P,s))damage()});shots=shots.filter(s=>s.x>-30&&s.x<730&&s.y>-40&&s.y<(r.sky?r.worldH+20:430));
if(r.pat&&frame%72===0){Sound.fx('oil');let a=[150,255,365,470,575];oil.push({x:a[eruption++%5],y:332,vy:-8.6,r:8})}if(r.rnd&&frame%(round===10?54:58)===0){Sound.fx('oil');oil.push({x:55+Math.random()*590,y:332,vy:-(7.6+Math.random()*2.4),r:8})}oil.forEach(o=>{o.y+=o.vy;o.vy+=.27;if(hit(P,{x:o.x-8,y:o.y-8,w:16,h:16}))damage()});oil=oil.filter(o=>o.y<360);dogs.forEach(d=>{d.x+=d.v;if(d.x<=d.min){d.x=d.min;d.v=Math.abs(d.v)}if(d.x>=d.max){d.x=d.max;d.v=-Math.abs(d.v)}if(hit(P,{x:d.x+3,y:d.y+3,w:d.w-6,h:d.h-3}))damage()});if(inv)inv--}
function loop(){if(!run)return;update();draw();raf=requestAnimationFrame(loop)}
function victory(){run=false;Sound.fx('victory');Sound.stop();cancelAnimationFrame(raf);obox.innerHTML='<h2>VICTORY!</h2><p><b>THE SUPER GIRLS SAVED THE DAY!</b></p><canvas id="celebrate" width="390" height="150" style="width:min(100%,390px);height:auto;background:#bfeaff;border-radius:14px;image-rendering:pixelated"></canvas><p style="font-size:24px"><b>SEASON 2 COMING SOON</b></p><p>You completed all 13 rounds of HEALTHIA HEROES — Season 1!</p><button class="btn" id="again">PLAY AGAIN</button>';ov.style.display='flex';let cc=document.getElementById('celebrate'),cx=cc.getContext('2d');cx.fillStyle='#bfeaff';cx.fillRect(0,0,390,150);cx.fillStyle='#76dd98';cx.fillRect(0,122,390,28);hd(cx,'Summy',60,40,1.75,1);hd(cx,'Sadie',175,48,1.6,1);hd(cx,'Vee',285,48,1.6,1);cx.fillStyle='#087f4e';cx.font='bold 14px Arial';cx.textAlign='center';cx.fillText('SUPER SUMMY',85,118);cx.fillText('SUPER SADIE',200,118);cx.fillText('SUPER VEE',310,118);document.getElementById('again').onclick=()=>{round=1;lives=3;dead=false;reset();run=true;Sound.play();loop()}}
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{document.querySelectorAll('.card').forEach(z=>z.classList.remove('sel'));c.classList.add('sel');hero=c.dataset.h});
document.querySelectorAll('.card canvas').forEach((c,i)=>{let z=c.getContext('2d');z.fillStyle='#bfeaff';z.fillRect(0,0,150,140);hd(z,['Summy','Sadie','Vee'][i],45,25,2.1,1)});
document.getElementById('start').onclick=()=>{sel.style.display='none';gp.style.display='block';document.body.classList.add('game-active');round=1;lives=3;dead=false;reset();run=true;Sound.play();loop()};
document.getElementById('choose').onclick=()=>{Sound.stop();run=false;cancelAnimationFrame(raf);key.l=key.r=key.j=0;document.body.classList.remove('game-active','phone-fullscreen');fsBtn.textContent='⛶ FULL SCREEN';gp.style.display='none';sel.style.display='block'};
document.getElementById('restart').onclick=()=>{lives=3;reset();if(!run){run=true;Sound.play();loop()}};
function bind(id,k){let e=document.getElementById(id),on=a=>{a.preventDefault();key[k]=1},off=a=>{a.preventDefault();key[k]=0};e.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(v=>e.addEventListener(v,off))}
bind('left','l');bind('right','r');bind('jump','j');
const fsBtn=document.getElementById('fullscreen');
function setPhoneFullscreen(on){document.body.classList.toggle('phone-fullscreen',on);fsBtn.textContent=on?'EXIT FULL':'⛶ FULL SCREEN';setTimeout(()=>window.scrollTo(0,0),30)}
fsBtn.onclick=async()=>{
 const entering=!document.body.classList.contains('phone-fullscreen');
 if(entering){
  setPhoneFullscreen(true);
  try{
   if(gp.requestFullscreen) await gp.requestFullscreen();
   else if(gp.webkitRequestFullscreen) gp.webkitRequestFullscreen();
   else if(gp.webkitEnterFullscreen) gp.webkitEnterFullscreen();
  }catch(e){}
  window.scrollTo(0,1);
 }else{
  setPhoneFullscreen(false);
  try{
   if(document.fullscreenElement&&document.exitFullscreen) await document.exitFullscreen();
   else if(document.webkitFullscreenElement&&document.webkitExitFullscreen) document.webkitExitFullscreen();
  }catch(e){}
 }
};


['left','right','jump','fullscreen','choose','restart','musicToggle','sfxToggle'].forEach(id=>{
 const el=document.getElementById(id);
 if(el){
  el.addEventListener('touchstart',e=>{}, {passive:true});
  el.style.webkitTapHighlightColor='transparent';
 }
});

const GAME_KEYS=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space']);
function gameIsActive(){return gp.style.display==='block'}
function blockGameBrowserAction(e){
 if(gameIsActive()&&GAME_KEYS.has(e.code)){
  e.preventDefault();
  e.stopPropagation();
  if(e.stopImmediatePropagation)e.stopImmediatePropagation();
  return true;
 }
 return false;
}
window.addEventListener('keydown',e=>{
 if(!gameIsActive())return;
 if(GAME_KEYS.has(e.code)){
  e.preventDefault();
  e.stopPropagation();
  if(e.code==='ArrowLeft')key.l=1;
  if(e.code==='ArrowRight')key.r=1;
  if(e.code==='Space'||e.code==='ArrowUp')key.j=1;
 }
},{capture:true,passive:false});
window.addEventListener('keyup',e=>{
 if(!gameIsActive())return;
 if(GAME_KEYS.has(e.code)){
  e.preventDefault();
  e.stopPropagation();
  if(e.code==='ArrowLeft')key.l=0;
  if(e.code==='ArrowRight')key.r=0;
  if(e.code==='Space'||e.code==='ArrowUp')key.j=0;
 }
},{capture:true,passive:false});
window.addEventListener('blur',()=>{key.l=key.r=key.j=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden){key.l=key.r=key.j=0;Sound.stop()}else if(run)Sound.play()});
document.addEventListener('selectstart',e=>{if(gameIsActive())e.preventDefault()});
document.addEventListener('dragstart',e=>{if(gameIsActive())e.preventDefault()});

})();
