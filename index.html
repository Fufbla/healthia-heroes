<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEALTHIA HEROES — Season 1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071a14;color:#fff;font-family:Arial,sans-serif}
#app{max-width:820px;margin:auto;padding:16px}h1{text-align:center;letter-spacing:2px}.tag{text-align:center;color:#8ee8bd}
.panel{background:#fff;color:#111;border-radius:18px;padding:18px;margin-top:14px}.cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.card{width:30%;min-width:130px;border:2px solid #ddd;border-radius:14px;padding:8px;text-align:center;background:#fafafa;cursor:pointer}.card.sel{border-color:#0a9d65}
.card canvas{width:100%;height:auto;background:#bfeaff;border-radius:10px}.btn{border:0;border-radius:25px;background:#0a9d65;color:#fff;padding:13px 24px;font-weight:800;cursor:pointer}
#start{display:block;margin:18px auto 0}.canvasWrap{position:relative;max-width:700px;margin:auto}#game{width:100%;height:auto;display:block;border-radius:12px;background:#86d7f7;image-rendering:pixelated}
#gamePanel{display:none}.controls{display:flex;justify-content:space-between;gap:10px;max-width:700px;margin:10px auto}.controls div{display:flex;gap:10px}
.ctrl{touch-action:none;border:1px solid #555;background:#17231f;color:#fff;border-radius:12px;padding:14px 20px;font-weight:bold}.minor{text-align:center;margin-top:10px}.minor button{margin:4px;padding:9px 14px;border-radius:20px;border:1px solid #bbb;background:white}
#overlay{display:none;position:absolute;inset:0;background:#061c17e8;border-radius:12px;align-items:center;justify-content:center;text-align:center;padding:20px;color:#fff}
#overlay h2{font-size:40px;color:#78efb5;margin:0 0 10px}
@media(max-width:520px){#app{padding:8px}.card{min-width:95px}.card b{font-size:12px}.ctrl{padding:13px 16px}}
</style></head>
<body><div id="app"><h1>HEALTHIA HEROES</h1><div class="tag">Play. Protect. Learn.</div>
<section id="select" class="panel"><h2 style="text-align:center">Choose Your Hero</h2>
<div class="cards">
<div class="card sel" data-h="Summy"><canvas width="150" height="140"></canvas><b>SUPER SUMMY</b></div>
<div class="card" data-h="Sadie"><canvas width="150" height="140"></canvas><b>SUPER SADIE</b></div>
<div class="card" data-h="Vee"><canvas width="150" height="140"></canvas><b>SUPER VEE</b></div>
</div><button id="start" class="btn">START GAME</button></section>
<section id="gamePanel" class="panel"><div class="canvasWrap"><canvas id="game" width="700" height="400"></canvas><div id="overlay"><div id="obox"></div></div></div>
<div class="controls"><div><button id="left" class="ctrl">LEFT</button><button id="right" class="ctrl">RIGHT</button></div><button id="jump" class="ctrl">JUMP</button></div>
<div class="minor"><button id="choose">CHARACTER SELECT</button><button id="restart">RESTART ROUND</button></div></section></div>
<script>
(()=>{const C=document.getElementById('game'),x=C.getContext('2d'),sel=document.getElementById('select'),gp=document.getElementById('gamePanel'),ov=document.getElementById('overlay'),obox=document.getElementById('obox');
let hero='Summy',round=1,lives=3,count=0,run=false,raf=0,frame=0,inv=0,shots=[],oil=[],bottles=[],eruption=0;
const key={l:0,r:0,j:0};let jl=0;const P={x:25,y:307,w:27,h:38,vy:0,on:0};
const spill={p:[[0,345,700,55],[125,270,90,14],[275,215,90,14],[430,260,90,14],[560,195,100,14]],b:[[55,315],[180,240],[245,315],[320,185],[465,230],[585,165],[500,315],[665,315]],e:[610,141,48,54],s:[[175,331,58,14],[365,331,62,14],[555,331,58,14]]};
const op=[[15,310,82,16],[125,260,78,16],[230,205,78,16],[335,265,78,16],[440,205,78,16],[545,255,72,16],[625,190,62,16]];
const L={
1:{g:6,p:[[0,345,700,55],[130,270,100,14],[300,225,100,14],[475,270,105,14]],b:[[70,315],[180,240],[270,315],[350,195],[520,240],[570,315]],e:[635,291,48,54]},
2:{g:7,p:[[0,345,700,55],[95,280,80,14],[225,225,80,14],[365,280,75,14],[485,215,80,14],[590,265,75,14]],b:[[55,315],[135,250],[260,195],[335,315],[400,250],[525,185],[660,315]],e:[600,211,48,54]},
3:{g:7,p:[[0,345,700,55],[105,270,85,14],[250,215,90,14],[410,265,90,14],[555,205,90,14]],b:[[55,315],[155,240],[225,315],[295,185],[455,235],[600,175],[665,315]],e:[570,151,48,54],m:1,f:105,sp:4.2},
4:{g:9,p:[[0,345,700,55],[80,285,68,14],[190,235,68,14],[300,185,68,14],[415,245,68,14],[530,195,68,14],[620,260,60,14]],b:[[45,315],[115,255],[220,205],[335,155],[390,315],[450,215],[565,165],[645,230],[680,315]],e:[625,206,48,54],m:1,f:78,sp:5},
5:{g:8,...spill},6:{g:8,...spill,m:1,f:88,sp:4.7},
7:{g:8,p:op,b:[[55,280],[163,230],[268,175],[373,235],[478,175],[580,225],[652,160],[390,125]],e:[632,136,48,54],o:1},
8:{g:4,p:op,b:[[163,230],[268,175],[478,175],[652,160]],e:[632,136,48,54],o:1,pat:1},
9:{g:5,p:op,b:[[55,280],[163,230],[268,175],[478,175],[652,160]],e:[632,136,48,54],o:1,rnd:1},
10:{g:5,p:op,b:[[55,280],[163,230],[268,175],[478,175],[652,160]],e:[632,136,48,54],o:1,rnd:1,m:1,f:76,fin:1}};
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function hd(c,n,X,Y,s=1,arms=0){c.save();c.translate(X,Y);c.scale(s,s);let sad=n==='Sadie',vee=n==='Vee';c.fillStyle=vee?'#8a5c42':sad?'#9a6848':'#8b5e3c';c.fillRect(7,7,16,15);
if(sad){c.fillStyle='#d8aa45';[[4,2,5,21],[8,-1,5,18],[12,-3,5,18],[16,-3,5,18],[20,-1,5,18],[24,2,5,21]].forEach(a=>c.fillRect(...a));c.fillStyle='#e2b13f';c.fillRect(21,-7,8,5);c.fillRect(25,-10,5,11)}
else if(vee){c.fillStyle='#211b1b';c.fillRect(7,0,16,9);c.fillRect(11,-5,11,7);c.fillStyle='#fff';c.fillRect(20,-7,8,5);c.fillRect(24,-10,5,11)}
else{c.fillStyle='#211b1b';c.fillRect(3,0,5,22);c.fillRect(8,-3,5,18);c.fillRect(13,-4,5,18);c.fillRect(18,-2,5,19);c.fillRect(23,1,5,21);c.strokeStyle='#111';c.lineWidth=2;c.strokeRect(8,10,6,5);c.strokeRect(17,10,6,5)}
c.fillStyle='#079b55';c.fillRect(5,21,20,24);c.fillStyle='#fff';c.fillRect(8,25,14,12);c.fillStyle='#079b55';c.font='10px Arial';c.textAlign='center';c.fillText(sad||vee?'♻':'🌎',15,35);c.fillStyle='#079b55';if(arms){c.fillRect(-1,23,7,18);c.fillRect(24,23,7,18)}else{c.fillRect(0,24,6,17);c.fillRect(24,24,6,17)}c.fillStyle='#083a2c';c.fillRect(6,45,7,12);c.fillRect(18,45,7,12);c.restore()}
function bg(){let q=x.createLinearGradient(0,0,0,400);q.addColorStop(0,'#7bd2f5');q.addColorStop(1,'#e9fbff');x.fillStyle=q;x.fillRect(0,0,700,400);x.fillStyle='#ffe382';x.beginPath();x.arc(620,60,28,0,7);x.fill();x.fillStyle='#76dd98';x.beginPath();x.ellipse(180,350,250,55,0,0,7);x.fill();x.beginPath();x.ellipse(530,350,230,60,0,0,7);x.fill()}
function monster(){x.fillStyle='#37474f';x.fillRect(590,296,48,49);x.fillStyle='#fff';x.fillRect(598,305,11,10);x.fillRect(619,305,11,10);x.fillStyle='#d32f2f';x.fillRect(602,308,5,5);x.fillRect(621,308,5,5);x.fillStyle='#050505';x.fillRect(601,328,27,8);x.fillStyle='#fff';x.fillRect(605,328,4,4);x.fillRect(620,328,4,4)}
function reset(all=0){if(all)lives=3;count=0;shots=[];oil=[];frame=0;eruption=0;bottles=L[round].b.map(a=>({x:a[0],y:a[1],w:16,h:25,t:0}));P.x=L[round].o?40:25;P.y=L[round].o?272:307;P.vy=0;P.on=0;inv=60;ov.style.display='none'}
function damage(){if(inv)return;if(--lives<=0){run=false;obox.innerHTML='<h2>GAME OVER</h2><button class="btn" id="rr">RESTART ROUND</button>';ov.style.display='flex';setTimeout(()=>document.getElementById('rr').onclick=()=>{lives=3;reset();run=true;loop()},0);return}P.x=L[round].o?40:25;P.y=L[round].o?272:307;P.vy=0;inv=80}
function draw(){let r=L[round];bg();x.fillStyle='#24384c';x.fillRect(0,0,700,28);x.fillStyle='#fff';x.font='bold 13px Arial';x.fillText('HERO: SUPER '+hero.toUpperCase(),10,19);x.fillText('ROUND '+round+'/10',300,19);x.fillText('BOTTLES '+count+'/'+r.g,480,19);x.fillText('LIVES '+'♥'.repeat(Math.max(lives,0)),610,19);
if(r.o){x.fillStyle='#17120e';x.fillRect(0,335,700,65);x.fillStyle='#5d431f';for(let i=0;i<700;i+=55){x.beginPath();x.ellipse(i+20,350+(i%3)*5,28,8,0,0,7);x.fill()}}
r.p.forEach(a=>{x.fillStyle='#20c975';x.fillRect(...a);x.fillStyle='#76501b';x.fillRect(a[0],a[1]+9,a[2],5)});
(r.s||[]).forEach(a=>{x.fillStyle='#183d2c';x.beginPath();x.ellipse(a[0]+a[2]/2,a[1]+7,a[2]/2,9,0,0,7);x.fill();x.fillStyle='#6b8e23';x.beginPath();x.ellipse(a[0]+a[2]/2,a[1]+5,a[2]/3,4,0,0,7);x.fill()});
bottles.filter(b=>!b.t).forEach(b=>{x.fillStyle='#0da8e8';x.fillRect(b.x+5,b.y,6,7);x.fillStyle='#fff';x.fillRect(b.x+2,b.y+7,12,16);x.fillStyle='#0a9d65';x.font='11px Arial';x.fillText('♻',b.x+3,b.y+20)});
x.fillStyle='#fff';x.fillRect(...r.e);x.strokeStyle='#08a05e';x.lineWidth=4;x.strokeRect(...r.e);x.fillStyle='#08a05e';x.font='28px Arial';x.fillText('♻',r.e[0]+9,r.e[1]+36);
if(r.m)monster();shots.forEach(s=>{x.fillStyle='#606b70';x.fillRect(s.x,s.y,s.w,s.h);x.fillStyle='#a3e635';x.fillRect(s.x+5,s.y+3,6,3)});oil.forEach(o=>{x.fillStyle='#21160e';x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill()});if(inv%10<5)hd(x,hero,P.x,P.y,1)}
function update(){let r=L[round],old=P.y;if(key.l)P.x-=4.15;if(key.r)P.x+=4.15;P.x=Math.max(0,Math.min(673,P.x));if(key.j&&!jl&&P.on){P.vy=-10.9;P.on=0}jl=key.j;P.vy+=.59;P.y+=P.vy;P.on=0;
r.p.forEach(a=>{if(P.vy>=0&&P.x+P.w>a[0]&&P.x<a[0]+a[2]&&old+P.h<=a[1]+4&&P.y+P.h>=a[1]){P.y=a[1]-P.h;P.vy=0;P.on=1}});
if((r.o&&P.y+P.h>=335)||(!r.o&&P.y>410))damage();(r.s||[]).forEach(a=>{if(hit({x:P.x+5,y:P.y+P.h-5,w:P.w-10,h:5},{x:a[0]+5,y:a[1],w:a[2]-10,h:a[3]}))damage()});
bottles.forEach(b=>{if(!b.t&&hit(P,b)){b.t=1;count++}});let e={x:r.e[0],y:r.e[1],w:r.e[2],h:r.e[3]};if(count===r.g&&hit(P,e)){if(round===10){victory();return}else{round++;reset()}}
frame++;if(r.m&&frame%r.f===0){if(round===10){let ps=[[-5.3,0,0,325],[-4.6,-3.2,.08,319],[-4.2,-6.2,.22,319],[-5,2,.03,285]],p=ps[Math.floor(Math.random()*ps.length)];shots.push({x:584,y:p[3],w:18,h:10,vx:p[0],vy:p[1],g:p[2]})}else shots.push({x:584,y:323,w:18,h:10,vx:-r.sp,vy:0,g:0})}
shots.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=s.g;if(hit(P,s))damage()});shots=shots.filter(s=>s.x>-30&&s.y>-40&&s.y<430);
if(r.pat&&frame%72===0){let a=[150,255,365,470,575];oil.push({x:a[eruption++%5],y:332,vy:-8.6,r:8})}if(r.rnd&&frame%(round===10?54:58)===0)oil.push({x:55+Math.random()*590,y:332,vy:-(7.6+Math.random()*2.4),r:8});oil.forEach(o=>{o.y+=o.vy;o.vy+=.27;if(hit(P,{x:o.x-8,y:o.y-8,w:16,h:16}))damage()});oil=oil.filter(o=>o.y<360);if(inv)inv--}
function loop(){if(!run)return;update();draw();raf=requestAnimationFrame(loop)}
function victory(){run=false;cancelAnimationFrame(raf);obox.innerHTML='<h2>VICTORY!</h2><p><b>THE SUPER GIRLS SAVED THE DAY!</b></p><canvas id="celebrate" width="390" height="150" style="width:min(100%,390px);height:auto;background:#bfeaff;border-radius:14px;image-rendering:pixelated"></canvas><p style="font-size:24px"><b>SEASON 2 COMING SOON</b></p><p>You completed all 10 rounds of HEALTHIA HEROES — Season 1.</p><button class="btn" id="again">PLAY AGAIN</button>';ov.style.display='flex';let cc=document.getElementById('celebrate'),cx=cc.getContext('2d');cx.fillStyle='#bfeaff';cx.fillRect(0,0,390,150);cx.fillStyle='#76dd98';cx.fillRect(0,122,390,28);hd(cx,'Summy',60,40,1.75,1);hd(cx,'Sadie',175,48,1.6,1);hd(cx,'Vee',285,48,1.6,1);cx.fillStyle='#087f4e';cx.font='bold 14px Arial';cx.textAlign='center';cx.fillText('SUPER SUMMY',85,118);cx.fillText('SUPER SADIE',200,118);cx.fillText('SUPER VEE',310,118);document.getElementById('again').onclick=()=>{round=1;lives=3;reset();run=true;loop()}}
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{document.querySelectorAll('.card').forEach(z=>z.classList.remove('sel'));c.classList.add('sel');hero=c.dataset.h});
document.querySelectorAll('.card canvas').forEach((c,i)=>{let z=c.getContext('2d');z.fillStyle='#bfeaff';z.fillRect(0,0,150,140);hd(z,['Summy','Sadie','Vee'][i],45,25,2.1,1)});
document.getElementById('start').onclick=()=>{sel.style.display='none';gp.style.display='block';round=1;lives=3;reset();run=true;loop()};
document.getElementById('choose').onclick=()=>{run=false;cancelAnimationFrame(raf);gp.style.display='none';sel.style.display='block'};
document.getElementById('restart').onclick=()=>{lives=3;reset();if(!run){run=true;loop()}};
function bind(id,k){let e=document.getElementById(id),on=a=>{a.preventDefault();key[k]=1},off=a=>{a.preventDefault();key[k]=0};e.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(v=>e.addEventListener(v,off))}
bind('left','l');bind('right','r');bind('jump','j');
addEventListener('keydown',e=>{if(e.code==='ArrowLeft'){e.preventDefault();key.l=1}if(e.code==='ArrowRight'){e.preventDefault();key.r=1}if(e.code==='Space'){e.preventDefault();key.j=1}});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft')key.l=0;if(e.code==='ArrowRight')key.r=0;if(e.code==='Space')key.j=0});
})();
</script></body></html>
