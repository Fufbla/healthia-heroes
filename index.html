  let travel=Math.min(1,Math.max(0,(t-20)/135));

    let px=57+i*31+travel*(142+i*19);
    hd(x,n,px,269+Math.sin(t*.12+i)*2,0.8,1);
  });
  // A towering evil tree rises from the forest and blocks their path.
  let grow=Math.min(1,Math.max(0,(t-150)/85));
  if(grow>0){
    x.save();x.translate(525,331);x.scale(1,grow);
    x.fillStyle='#3b251f';x.beginPath();x.moveTo(-61,0);x.lineTo(-38,-240);x.lineTo(-15,-276);x.lineTo(15,-268);x.lineTo(42,-231);x.lineTo(59,0);x.closePath();x.fill();
    x.strokeStyle='#563429';x.lineWidth=13;x.lineCap='round';
    x.beginPath();x.moveTo(-23,-177);x.lineTo(-111,-237);x.lineTo(-147,-285);x.moveTo(19,-192);x.lineTo(94,-258);x.lineTo(132,-295);x.stroke();
    x.fillStyle='#1c432b';for(let i=0;i<8;i++){x.beginPath();x.arc(-80+(i%4)*52,-245-Math.floor(i/4)*34,51,0,7);x.fill()}
    x.fillStyle='#ff2939';x.beginPath();x.ellipse(-19,-147,11,15,0,0,7);x.ellipse(20,-147,11,15,0,0,7);x.fill();
    x.fillStyle='#fff1aa';x.fillRect(-18,-149,5,7);x.fillRect(21,-149,5,7);
    x.strokeStyle='#0c0909';x.lineWidth=7;x.beginPath();x.moveTo(-18,-109);x.quadraticCurveTo(0,-92,23,-110);x.stroke();
    x.restore();
  }
  if(t>255){
    x.fillStyle='rgba(0,0,0,'+Math.min(.79,(t-255)/85*.79)+')';x.fillRect(0,0,700,400);
    x.textAlign='center';x.fillStyle='#fff';x.shadowColor='#64e5a5';x.shadowBlur=14;
    x.font='bold 36px Arial';x.fillText('SEASON 3',350,173);
    x.font='bold 29px Arial';x.fillText('COMING SOON',350,216);
    x.shadowBlur=0;x.textAlign='left';
  }
  if(t===440){
    obox.innerHTML='<h2>SEASON 3 COMING SOON</h2><p>The Super Girls made it through the door... but an evil tree blocks their path!</p><button class="btn" id="again">PLAY LEVEL 13 AGAIN</button>';
    ov.style.display='flex';document.getElementById('again').onclick=()=>{endingActive=false;endingFrame=0;round=26;reset();run=true;Sound.play();loop()};
    run=false;Sound.stop();cancelAnimationFrame(raf);
  }
}

// Virtual joystick: pointer capture allows uninterrupted left/right direction changes.
const stick=document.getElementById('joystick'), knob=document.getElementById('joystickKnob');
let stickPointer=null;
function resetStick(){stickPointer=null;touchMove.l=touchMove.r=0;knob.style.transform='translate(-50%,-50%)'}
function moveStick(e){
 if(stickPointer!==e.pointerId)return;
 const rect=stick.getBoundingClientRect();
 const dx=Math.max(-1,Math.min(1,(e.clientX-(rect.left+rect.width/2))/(rect.width*.32)));
 touchMove.l=dx<-.22?1:0;touchMove.r=dx>.22?1:0;
 knob.style.transform=`translate(calc(-50% + ${dx*rect.width*.25}px),-50%)`;
}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});
stick.addEventListener('pointermove',e=>{if(stickPointer!==null){e.preventDefault();moveStick(e)}});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>stick.addEventListener(t,e=>{if(stickPointer===e.pointerId)resetStick()}));
// Poll the standard browser Gamepad API once per animation frame.
let gamepadWasConnected=false;
function pollGamepad(){
 const pads=navigator.getGamepads?navigator.getGamepads():[];
 const g=Array.from(pads||[]).find(v=>v&&v.connected);
 const status=document.getElementById('padStatus');
 if(!g){pad.l=pad.r=pad.j=0;if(gamepadWasConnected){status.textContent='Touch joystick · Keyboard · Bluetooth/USB controller';gamepadWasConnected=false}return}
 if(!gamepadWasConnected){status.textContent='🎮 Controller connected: '+g.id.slice(0,48);gamepadWasConnected=true}
 const axis=g.axes&&g.axes.length?g.axes[0]:0;
 const pressed=i=>!!(g.buttons&&g.buttons[i]&&g.buttons[i].pressed);
 pad.l=axis<-.25||pressed(14)?1:0;
 pad.r=axis>.25||pressed(15)?1:0;
 pad.j=pressed(0)||pressed(1)||pressed(2)||pressed(3)?1:0;
}
function bind(id,k){let e=document.getElementById(id),on=a=>{a.preventDefault();key[k]=1},off=a=>{a.preventDefault();key[k]=0};e.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(v=>e.addEventListener(v,off))}
bind('jump','j');
['jump','choose','restart','musicToggle','sfxToggle'].forEach(id=>{
 const el=document.getElementById(id);
 if(el){
  el.addEventListener('touchstart',e=>{}, {passive:true});
  el.style.webkitTapHighlightColor='transparent';
 }
});

const GAME_KEYS=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space']);
function gameIsActive(){return gp.style.display==='block'}
function blockGameBrowserAction(e){
 if(gameIsActive()&&GAME_KEYS.has(e.code)){
  e.preventDefault();
  e.stopPropagation();
  if(e.stopImmediatePropagation)e.stopImmediatePropagation();
  return true;
 }
 return false;
}
window.addEventListener('keydown',e=>{
 if(!gameIsActive())return;
 if(GAME_KEYS.has(e.code)){
  e.preventDefault();
  e.stopPropagation();
  if(e.code==='ArrowLeft')key.l=1;
  if(e.code==='ArrowRight')key.r=1;
  if(e.code==='Space'||e.code==='ArrowUp')key.j=1;
 }
},{capture:true,passive:false});
window.addEventListener('keyup',e=>{
 if(!gameIsActive())return;
 if(GAME_KEYS.has(e.code)){
  e.preventDefault();
  e.stopPropagation();
  if(e.code==='ArrowLeft')key.l=0;
  if(e.code==='ArrowRight')key.r=0;
  if(e.code==='Space'||e.code==='ArrowUp')key.j=0;
 }
},{capture:true,passive:false});
window.addEventListener('blur',()=>{key.l=key.r=key.j=0;touchMove.l=touchMove.r=0;pad.l=pad.r=pad.j=0;resetStick()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){key.l=key.r=key.j=0;touchMove.l=touchMove.r=0;pad.l=pad.r=pad.j=0;resetStick();Sound.stop()}else if(run)Sound.play()});
document.addEventListener('selectstart',e=>{if(gameIsActive())e.preventDefault()});
document.addEventListener('dragstart',e=>{if(gameIsActive())e.preventDefault()});

})();
</script></body></html>
