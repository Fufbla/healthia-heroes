<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEALTHIA Click-to-Color</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#eef7f2;color:#14251b}
.app{max-width:1400px;margin:auto;padding:14px;display:grid;grid-template-columns:230px 1fr;gap:14px}
.panel{background:white;border-radius:18px;padding:14px;box-shadow:0 5px 18px #0002}
h1{font-size:22px;margin:0 0 12px} h2{font-size:16px;margin:14px 0 8px}
.colors{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.sw{aspect-ratio:1;border:2px solid #fff;border-radius:9px;box-shadow:0 0 0 1px #aaa;cursor:pointer}
.sw.sel{box-shadow:0 0 0 3px #111}
button{width:100%;padding:10px;margin:5px 0;border:0;border-radius:10px;font-weight:700;cursor:pointer}
.pages{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pagebtn{background:#e8f3ec;padding:5px;margin:0;border:2px solid transparent}
.pagebtn img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:7px;background:white}
.pagebtn span{display:block;font-size:10px;line-height:1.15;margin-top:5px}
.pagebtn.active{background:#187a42;color:white;border-color:#0e542c}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.controls button{margin:0}
.stage{overflow:auto;max-height:88vh;background:#dfe9e3;border-radius:18px;padding:10px}
.wrap{transform-origin:top left;width:100%}
canvas{display:block;width:100%;height:auto;background:white;border:3px solid #111;border-radius:14px;cursor:crosshair}
#status{font-size:12px;min-height:28px;margin-top:8px;color:#496052}
@media(max-width:760px){.app{grid-template-columns:1fr}.stage{max-height:none}}
</style>
</head>

const palette=["#f5222d","#a80f1a","#ff7a00","#f4a900","#ffd400","#fff176","#7ac943","#20a84a","#08783d","#52d6b0","#00a6a6","#35d5e5","#66b9ff","#1683ef","#193fc8","#142a67","#b89be8","#8b35bd","#57207f","#ef5a9b","#f8a7c5","#d81b60","#f6b58a","#f3c9a5","#dda66c","#a66a3f","#7b451f","#4b2b1b","#fff1d0","#ffffff","#d8d8d8","#888888","#444444","#111111"];
const cv=document.getElementById("cv"),ctx=cv.getContext("2d",{willReadFrequently:true});
const wrap=document.getElementById("wrap"),status=document.getElementById("status");
let original=null,boundary=null,color=[245,34,45],pageIndex=0,zoom=1,hist=[],saved=[null,null,null];

function buildPalette(){
 const box=document.getElementById("colors");
 palette.forEach((hex,i)=>{
  const b=document.createElement("button");b.className="sw"+(i===0?" sel":"");b.style.background=hex;b.title=hex;
  b.onclick=()=>{document.querySelectorAll(".sw").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");
   color=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];};
  box.appendChild(b);
 });
}
buildPalette();

function buildBoundary(){
 const d=original.data,w=cv.width,h=cv.height;
 let ink=new Uint8Array(w*h);

 // Read permanent linework from the untouched original page.
 for(let p=0;p<w*h;p++){
   const i=p*4,lum=(d[i]+d[i+1]+d[i+2])/3;
   if(lum < 205) ink[p]=1;
 }

 // Use the same line-boundary treatment on every page for consistent coloring.
 const radius = 1;
 const sealed=new Uint8Array(w*h);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
   const p=y*w+x;
   if(!ink[p])continue;
   for(let dy=-radius;dy<=radius;dy++){
     for(let dx=-radius;dx<=radius;dx++){
       if(Math.abs(dx)+Math.abs(dy)>radius)continue;
       const xx=x+dx,yy=y+dy;
       if(xx>=0&&xx<w&&yy>=0&&yy<h) sealed[yy*w+xx]=1;
     }
   }
 }
 boundary=sealed;
}
function loadPage(idx){
 if(original && cv.width) saved[pageIndex]=ctx.getImageData(0,0,cv.width,cv.height);
 pageIndex=idx;hist=[];status.textContent="Loading page…";
 document.querySelectorAll(".pagebtn").forEach((b,i)=>b.classList.toggle("active",i===idx));
 const im=new Image();
 im.onload=()=>{
   cv.width=im.width;cv.height=im.height;ctx.drawImage(im,0,0);
   original=ctx.getImageData(0,0,cv.width,cv.height);buildBoundary();
   if(saved[idx] && saved[idx].width===cv.width && saved[idx].height===cv.height)ctx.putImageData(saved[idx],0,0);
   status.textContent="Pick a color, then click a section.";
 };
 im.src=pages[idx].src;
}
document.querySelectorAll(".pagebtn").forEach((b,i)=>b.onclick=()=>loadPage(i));

function fill(sx,sy){
 const w=cv.width,h=cv.height,start=sy*w+sx;
 if(!boundary||boundary[start]){
   status.textContent="Click inside a white coloring section.";
   return;
 }

 const seen=new Uint8Array(w*h),stack=[start],region=[];
 const hardLimit = w*h;

 while(stack.length){
   const p=stack.pop();
   if(p<0||p>=w*h||seen[p]||boundary[p])continue;
   seen[p]=1;
   region.push(p);

   if(region.length>hardLimit){
     status.textContent="Open outline detected — fill stopped so it cannot bleed.";
     return;
   }

   const x=p%w,y=(p/w)|0;
   if(x+1<w)stack.push(p+1);
   if(x>0)stack.push(p-1);
   if(y+1<h)stack.push(p+w);
   if(y>0)stack.push(p-w);
 }

 if(!region.length)return;

 const img=ctx.getImageData(0,0,w,h),d=img.data,od=original.data;
 hist.push(ctx.getImageData(0,0,w,h));
 if(hist.length>5)hist.shift();

 for(const p of region){
   const i=p*4;
   d[i]=color[0];d[i+1]=color[1];d[i+2]=color[2];d[i+3]=255;
 }

 // Paint only the immediate light antialias fringe.
 const fringe=new Uint8Array(w*h);
 for(const p of region){
   const x=p%w,y=(p/w)|0;
   if(x>0)fringe[p-1]=1;
   if(x+1<w)fringe[p+1]=1;
   if(y>0)fringe[p-w]=1;
   if(y+1<h)fringe[p+w]=1;
 }
 for(let p=0;p<w*h;p++){
   if(!fringe[p]||seen[p])continue;
   const i=p*4,lum=(od[i]+od[i+1]+od[i+2])/3;
   if(lum>200){
     d[i]=color[0];d[i+1]=color[1];d[i+2]=color[2];d[i+3]=255;
   }
 }

 // Put the real black artwork back on top.
 for(let p=0;p<w*h;p++){
   const i=p*4,lum=(od[i]+od[i+1]+od[i+2])/3;
   if(lum<165){
     d[i]=od[i];d[i+1]=od[i+1];d[i+2]=od[i+2];d[i+3]=255;
   }
 }

 ctx.putImageData(img,0,0);
 status.textContent="Colored section only.";
}
cv.addEventListener("click",e=>{
 const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*cv.width/r.width),y=Math.floor((e.clientY-r.top)*cv.height/r.height);
 fill(x,y);
});
document.getElementById("undo").onclick=()=>{if(hist.length)ctx.putImageData(hist.pop(),0,0);};
document.getElementById("reset").onclick=()=>{if(original){ctx.putImageData(original,0,0);saved[pageIndex]=null;hist=[];}};
function setZoom(z){zoom=Math.max(1,Math.min(3,z));wrap.style.width=(zoom*100)+"%";document.getElementById("zoom").textContent=Math.round(zoom*100)+"%";}
document.getElementById("plus").onclick=()=>setZoom(zoom+.5);
document.getElementById("minus").onclick=()=>setZoom(zoom-.5);
document.getElementById("zoom").onclick=()=>setZoom(1);
loadPage(0);
</script></body></html>
