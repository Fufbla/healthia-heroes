<script>
(function(){

const notes=[261.63,329.63,392,493.88,440,392,329.63,293.66,

function note(freq,when,duration,volume,kind="sine"){
  if(!ctx||!master)return;

function schedule(){

   const i=step%16;

  if(!ctx){
   const AC=window.AudioContext||window.webkitAudioContext;
   if(!AC)return;
   ctx=new AC();master=ctx.createGain();master.gain.value=.5;master.connect(ctx.destination);
  }
  // Start/resume directly inside the actual touch/click gesture, before any await.
  if(ctx.state!=="running")ctx.resume().catch(()=>{});
  if(!playing){
   playing=true;nextTime=ctx.currentTime+.1;
   schedule();timer=setInterval(schedule,120);
  }
  btn.textContent="♫ Music: On";btn.setAttribute("aria-pressed","true");
 }catch(e){console.warn("Eco Sort audio",e)}
}
function firstGesture(e){
 if(e.target===btn)return;
 startMusic();
 if(playing){
  document.removeEventListener("touchstart",firstGesture,true);
  document.removeEventListener("pointerdown",firstGesture,true);
  document.removeEventListener("click",firstGesture,true);
  document.removeEventListener("keydown",firstGesture,true);
 }
}
for(const type of ["touchstart","pointerdown","click","keydown"])
 document.addEventListener(type,firstGesture,{capture:true,passive:true});
btn.addEventListener("click",function(){
 if(!playing){muted=false;startMusic();return}
 muted=!muted;
 if(master)master.gain.value=muted?0:.5;
 btn.textContent=muted?"♫ Music: Off":"♫ Music: On";
 btn.setAttribute("aria-pressed",String(!muted));
});
document.addEventListener("visibilitychange",function(){
 if(!ctx||!playing)return;
 if(document.hidden){ctx.suspend().catch(()=>{})}
 else if(!muted){ctx.resume().then(()=>{nextTime=ctx.currentTime+.1}).catch(()=>{})}
});
})();
</script>
</body></html>
